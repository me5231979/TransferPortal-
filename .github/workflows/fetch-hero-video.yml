name: Fetch hero video clips
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download clips from Runway
        run: |
          mkdir -p assets/video
          curl -fL -o assets/video/hero-conversation.mp4 "$URL1"
          curl -fL -o assets/video/hero-collaboration.mp4 "$URL2"
          curl -fL -o assets/video/hero-mentorship.mp4 "$URL3"
          ls -la assets/video
        env:
          URL1: ${{ vars.HERO_URL1 || inputs.url1 || 'PLACEHOLDER1' }}
          URL2: ${{ vars.HERO_URL2 || inputs.url2 || 'PLACEHOLDER2' }}
          URL3: ${{ vars.HERO_URL3 || inputs.url3 || 'PLACEHOLDER3' }}
      - name: Commit and push to main and gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/video
          git commit -m "Add hero montage video clips"
          git push origin HEAD:main
          git push -f origin HEAD:gh-pages
