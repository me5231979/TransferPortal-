name: Fetch hero video clips
on:
  push:
    branches: [main]
    paths: ['.github/hero-video-urls.json']
permissions:
  contents: write
jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download clips from Runway
        run: |
          mkdir -p assets/video
          curl -fL -o assets/video/hero-conversation.mp4 "$(jq -r '.url1' .github/hero-video-urls.json)"
          curl -fL -o assets/video/hero-collaboration.mp4 "$(jq -r '.url2' .github/hero-video-urls.json)"
          curl -fL -o assets/video/hero-mentorship.mp4 "$(jq -r '.url3' .github/hero-video-urls.json)"
          ls -la assets/video
      - name: Commit and push to main and gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/video
          git rm -q .github/hero-video-urls.json
          git commit -m "Add hero montage video clips"
          git push origin HEAD:main
          git push -f origin HEAD:gh-pages
