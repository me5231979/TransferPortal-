name: Generate narration audio
# Synthesizes narration MP3s from assets/audio/narration.json via the
# ElevenLabs API, loudness-normalizes every track to a single standard,
# rebuilds the SCORM package, and republishes gh-pages.
#
# Sections are only re-synthesized when their text, voice, or model
# changed (tracked in assets/audio/narration-state.json), so edits do
# not re-spend API credits on unchanged tracks. Normalization runs on
# any track not yet normalized. Requires the ELEVENLABS_API_KEY secret.
on:
  push:
    branches: [main]
    paths:
      - 'assets/audio/narration.json'
      - 'assets/audio/narration-state.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Synthesize changed tracks and normalize loudness
        env:
          XI_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, subprocess, sys, urllib.request

          cfg = json.load(open('assets/audio/narration.json'))
          voice, model = cfg['voice_id'], cfg.get('model_id', 'eleven_multilingual_v2')
          state_path = 'assets/audio/narration-state.json'
          state = json.load(open(state_path)) if os.path.exists(state_path) else {}

          def text_hash(text):
              return hashlib.sha256(('%s|%s|%s' % (voice, model, text)).encode()).hexdigest()

          key = os.environ.get('XI_KEY', '')
          for sid, text in cfg['sections'].items():
              path = 'assets/audio/narr-%s.mp3' % sid
              h = text_hash(text)
              entry = state.get(sid, {})
              if entry.get('hash') == h and os.path.exists(path):
                  print(sid, ': unchanged, skipping synthesis')
              else:
                  if not key:
                      sys.exit('The ELEVENLABS_API_KEY repository secret is not set. '
                               'Add it under Settings > Secrets and variables > Actions.')
                  url = ('https://api.elevenlabs.io/v1/text-to-speech/%s'
                         '?output_format=mp3_44100_128' % voice)
                  body = json.dumps({'text': text, 'model_id': model}).encode()
                  req = urllib.request.Request(url, data=body, headers={
                      'xi-api-key': key, 'Content-Type': 'application/json'})
                  with urllib.request.urlopen(req) as r:
                      open(path, 'wb').write(r.read())
                  entry = {'hash': h, 'normalized': False}
                  print(sid, ': synthesized')
              if not entry.get('normalized'):
                  tmp = path + '.norm.mp3'
                  subprocess.run(['ffmpeg', '-y', '-hide_banner', '-loglevel', 'error',
                                  '-i', path,
                                  '-af', 'loudnorm=I=-16:TP=-1.5:LRA=11',
                                  '-ar', '44100', '-b:a', '128k', tmp], check=True)
                  os.replace(tmp, path)
                  entry['normalized'] = True
                  print(sid, ': normalized to -16 LUFS')
              state[sid] = entry

          json.dump(state, open(state_path, 'w'), indent=2)
          EOF

      - name: Rebuild SCORM package
        run: |
          python3 tools/build-web.py
          python3 tools/build-scorm.py

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/audio/*.mp3 assets/audio/narration-state.json web/index.html talent-marketplace-scorm12.zip
          git commit -m "Generate and normalize narration audio" || { echo "nothing to commit"; exit 0; }
          git push origin main
          git branch -f gh-pages main
          git push -f origin gh-pages
